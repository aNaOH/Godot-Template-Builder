<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Godot Encryption Key Generator</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, sans-serif;
      background: #f5f5f5;
      color: #111;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
    }

    .container {
      width: 100%;
      max-width: 600px;
    }

    h1 {
      font-size: 1.25rem;
      font-weight: 600;
      margin-bottom: 0.25rem;
    }

    .subtitle {
      font-size: 13px;
      color: #666;
      margin-bottom: 1.5rem;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      color: #444;
      margin-bottom: 6px;
    }

    textarea {
      width: 100%;
      border: 1px solid #ddd;
      border-radius: 6px;
      background: #fff;
      color: #111;
      font-family: monospace;
      font-size: 14px;
      line-height: 1.6;
      padding: 10px 12px;
      resize: vertical;
      min-height: 110px;
      outline: none;
      transition: border-color 0.15s;
    }

    textarea:focus { border-color: #888; }

    .actions {
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }

    button {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border: 1px solid #ddd;
      border-radius: 6px;
      background: #fff;
      color: #111;
      font-family: inherit;
      font-size: 13px;
      font-weight: 500;
      padding: 0 14px;
      height: 36px;
      cursor: pointer;
      transition: background 0.1s, border-color 0.1s;
      white-space: nowrap;
    }

    button:hover { background: #f0f0f0; }
    button:active { background: #e8e8e8; }

    button.primary {
      background: #111;
      color: #fff;
      border-color: #111;
    }

    button.primary:hover { background: #333; border-color: #333; }
    button.primary:active { background: #000; }

    hr {
      border: none;
      border-top: 1px solid #e5e5e5;
      margin: 1.25rem 0;
    }

    .result-section { display: none; }
    .result-section.visible { display: block; }

    .result-box {
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 6px;
      padding: 10px 12px;
      display: flex;
      align-items: flex-start;
      gap: 10px;
    }

    code {
      font-family: monospace;
      font-size: 13px;
      color: #111;
      word-break: break-all;
      flex: 1;
      line-height: 1.6;
    }

    button.icon-btn {
      background: none;
      border: 1px solid #ddd;
      border-radius: 5px;
      color: #888;
      cursor: pointer;
      padding: 5px 7px;
      display: flex;
      align-items: center;
      flex-shrink: 0;
      height: auto;
    }

    button.icon-btn:hover { color: #111; background: #f5f5f5; }

    .meta {
      font-size: 11px;
      color: #999;
      margin-top: 8px;
    }

    .toast {
      display: none;
      font-size: 12px;
      color: #555;
      margin-top: 8px;
    }

    .toast.show { display: block; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Godot Encryption Key Generator</h1>
    <p class="subtitle">Generate a encryption key for Godot or transform a password to a compatible encryption key</p>
    <p class="meta">Created by <a href="https://github.com/aNaOH" target="_blank">Abel</a> for <a href="https://github.com/aNaOH/Godot-Template-Builder" target="_blank">Godot Template Builder</a></p>

    <label for="input">Input text</label>
    <textarea id="input" placeholder="Write or paste your text here..."></textarea>

    <div class="actions">
      <button class="primary" id="btn">Generate Hash</button>
      <button id="random-btn">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <polyline points="16 3 21 3 21 8"></polyline>
          <line x1="4" y1="20" x2="21" y2="3"></line>
          <polyline points="21 16 21 21 16 21"></polyline>
          <line x1="15" y1="15" x2="21" y2="21"></line>
        </svg>
        Random
      </button>
    </div>

    <hr />

    <div class="result-section" id="result-section">
      <label>Output</label>
      <div class="result-box">
        <code id="hex-out"></code>
        <button class="icon-btn" id="copy-btn" title="Copy" aria-label="Copy result">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="9" y="9" width="13" height="13" rx="2"></rect>
            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
          </svg>
        </button>
      </div>
      <p class="meta">SHA-256 · 32 bytes · 64 characters</p>
      <p class="toast" id="toast">Copied.</p>
    </div>
  </div>

  <script>
    const btn = document.getElementById('btn');
    const randomBtn = document.getElementById('random-btn');
    const input = document.getElementById('input');
    const resultSection = document.getElementById('result-section');
    const hexOut = document.getElementById('hex-out');
    const copyBtn = document.getElementById('copy-btn');
    const toast = document.getElementById('toast');

    async function generate(text) {
      if (!text.trim()) { input.focus(); return; }
      const encoded = new TextEncoder().encode(text);
      const hashBuffer = await crypto.subtle.digest('SHA-256', encoded);
      const hex = Array.from(new Uint8Array(hashBuffer))
        .map(b => b.toString(16).padStart(2, '0'))
        .join('');
      hexOut.textContent = hex;
      resultSection.classList.add('visible');
      toast.classList.remove('show');
    }

    function randomText() {
      const bytes = new Uint8Array(16);
      crypto.getRandomValues(bytes);
      return Array.from(bytes).map(b => b.toString(16).padStart(2, '0')).join('');
    }

    btn.addEventListener('click', () => generate(input.value));

    randomBtn.addEventListener('click', async () => {
      const rand = randomText();
      input.value = rand;
      await generate(rand);
    });

    input.addEventListener('keydown', e => {
      if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) generate(input.value);
    });

    copyBtn.addEventListener('click', async () => {
      const txt = hexOut.textContent;
      if (!txt) return;
      try {
        await navigator.clipboard.writeText(txt);
        toast.textContent = 'Copied.';
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 2000);
      } catch {
        toast.textContent = 'Failed to copy automatically. Copy manually';
        toast.classList.add('show');
      }
    });
  </script>
</body>
</html>
